[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-batching-inference-server"
version = "0.1.0"
description = "Dynamic Batching-Based High-Throughput Image Inference Server"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Project Authors" }
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9",
    "pillow>=10,<13",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "httpx>=0.27,<1",
    "psutil>=5.9,<8",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
